name: Docs

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            ref:
                description: "Git ref to build (tag/branch)"
                required: false
                default: "master"

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.inputs.ref || github.ref }}

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install UV
              uses: astral-sh/setup-uv@v5

            - name: Install docs dependencies
              run: uv sync --group docs

            - name: Extract FlaUI versions
              run: uv run python scripts/extract_versions.py

            - name: Build docs
              run: uv run zensical build --strict -f zensical.toml

            - name: Configure Pages
              uses: actions/configure-pages@v5

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
