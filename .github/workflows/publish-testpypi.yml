name: Publish dev build to TestPyPI

# On every pull request to master, build a unique dev version (1.0.0.dev<run_id>) and upload it to
# TestPyPI so reviewers can install the candidate:
#
#   pip install -i https://test.pypi.org/simple/ flaui-uiautomation-wrapper
#
# Each run mints a unique 1.0.0.dev<run_id>, so uploads never collide (skip-existing guards re-runs).
#
# Uploads use Trusted Publishing (OIDC, no API token): TestPyPI must list this repository as a
# trusted publisher for `publish-testpypi.yml` with environment `testpypi`. PRs from forks can't
# mint an OIDC token, so the upload step is skipped for them.

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  id-token: write # Trusted Publishing + attestations

concurrency:
  group: testpypi-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  testpypi:
    name: Build and publish to TestPyPI
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/flaui-uiautomation-wrapper/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set dev version and build
        run: |
          set -euo pipefail
          VERSION="1.0.0.dev${{ github.run_id }}"
          uv version --frozen "$VERSION"
          uv build
          echo "Built dev version ${VERSION}"

      - name: Publish to TestPyPI
        # Skipped for fork PRs, which can't mint an OIDC token.
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
