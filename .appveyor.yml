# AppVeyor is the hosted Windows desktop UI gate for the FlaUI suite. The gate is
# trimmed (see test_script): the full UI suite runs only on pull requests and on
# master; routine feature-branch pushes run the fast tests/unit subset instead.
# Azure Pipelines owns linting, docs, packaging, deployment plumbing, and a
# smaller hosted Windows smoke job.
# Enable AppVeyor "Rolling builds" in project settings for pull requests so
# stale PR builds are cancelled when newer commits arrive. AppVeyor documents
# that setting as UI/API-level configuration, not an appveyor.yml key.
version: 1.0.{build}
image: Visual Studio 2022
build: off
skip_branch_with_pr: true

environment:
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"
  matrix:
    # Keep the full UI suite on one Python version while the Azure migration
    # stabilizes. Enable the remaining supported versions when ready.
    # - job_name: Python 3.10 x64
    #   PYTHON_VERSION: "3.10"
    #   PYTHON_ARCH: "64"
    #
    # - job_name: Python 3.11 x64
    #   PYTHON_VERSION: "3.11"
    #   PYTHON_ARCH: "64"
    #
    - job_name: Python 3.12 x64
      PYTHON_VERSION: "3.12"
      PYTHON_ARCH: "64"
    #
    # - job_name: Python 3.13 x64
    #   PYTHON_VERSION: "3.13"
    #   PYTHON_ARCH: "64"
    #
    # - job_name: Python 3.14 x64
    #   PYTHON_VERSION: "3.14"
    #   PYTHON_ARCH: "64"

cache:
  - "%USERPROFILE%\\.cache\\uv -> uv.lock, pyproject.toml"
  - ".venv -> uv.lock, pyproject.toml"

init:
  - ps: |
      $env:UV_PYTHON = $env:PYTHON_VERSION
      $env:UV_PROJECT_ENVIRONMENT = "$env:APPVEYOR_BUILD_FOLDER\.venv"
      $env:UV_CACHE_DIR = "$env:USERPROFILE\.cache\uv"
      $env:UV_NO_PROGRESS = "1"
      Write-Host "AppVeyor full UI suite: Python $env:PYTHON_VERSION x$env:PYTHON_ARCH"

install:
  - ps: |
      function Invoke-Checked {
        param([scriptblock] $Command)
        & $Command
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }

      irm https://astral.sh/uv/install.ps1 | iex
      $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
      $env:UV_NO_PROGRESS = "1"
      Invoke-Checked { uv --version }
      Invoke-Checked { uv --no-progress python install $env:PYTHON_VERSION }
      Invoke-Checked { uv --no-progress run --group unit-test --no-dev --package flaui-uiautomation-wrapper python --version }

test_script:
  - ps: |
      function Invoke-Checked {
        param([scriptblock] $Command)
        & $Command
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }

      $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
      $env:UV_PYTHON = $env:PYTHON_VERSION
      $env:UV_PROJECT_ENVIRONMENT = "$env:APPVEYOR_BUILD_FOLDER\.venv"
      $env:UV_CACHE_DIR = "$env:USERPROFILE\.cache\uv"
      $env:UV_NO_PROGRESS = "1"

      # Trim the gate: the slow full desktop UI suite only runs where it gates a merge
      # (pull requests, and pushes to master). Routine feature-branch pushes run the fast
      # unit subset only, so day-to-day turnaround does not pay for the full serial run.
      $runFull = ($env:APPVEYOR_REPO_BRANCH -eq 'master') -or [bool]$env:APPVEYOR_PULL_REQUEST_NUMBER
      if ($runFull) {
        Write-Host "Full gate: running the complete Windows desktop UI test suite with pytest..."
        Invoke-Checked { uv --no-progress run --group unit-test --no-dev --package flaui-uiautomation-wrapper --extra coverage coverage run -m pytest --junit-xml=test-results.xml --timeout=45 --timeout-method=thread --alluredir allure-results }
        # Enforce the coverage gate only on the full suite. The flag is passed explicitly here
        # (not via pyproject) so the fast unit subset and report/xml/html generation elsewhere
        # stay informational and do not fail on partial coverage.
        # v1.0 gate: 95% on the full UIA2/UIA3 x WinForms/WPF matrix. Unit-only coverage is ~88%;
        # the UI matrix carries automation_elements/application/input the rest of the way.
        Write-Host "Enforcing coverage gate (--fail-under=95)..."
        Invoke-Checked { uv --no-progress run --extra coverage coverage report --fail-under=95 }
      } else {
        Write-Host "Fast gate: running the unit subset only (the full UI suite runs on pull requests and on master)..."
        Invoke-Checked { uv --no-progress run --group unit-test --no-dev --package flaui-uiautomation-wrapper --extra coverage coverage run -m pytest tests/unit --junit-xml=test-results.xml --timeout=45 --timeout-method=thread --alluredir allure-results }
      }

after_test:
  - ps: |
      $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
      $env:UV_PYTHON = $env:PYTHON_VERSION
      $env:UV_PROJECT_ENVIRONMENT = "$env:APPVEYOR_BUILD_FOLDER\.venv"
      $env:UV_CACHE_DIR = "$env:USERPROFILE\.cache\uv"
      $env:UV_NO_PROGRESS = "1"
      Write-Host "Generating coverage reports..."
      if (Test-Path ".coverage") {
        uv --no-progress run --with coverage coverage xml
        uv --no-progress run --with coverage coverage html
      } else {
        Write-Host "No coverage data found; skipping coverage report generation."
      }

artifacts:
  - path: test-results.xml
    name: test-results

  - path: coverage.xml
    name: coverage

  - path: htmlcov
    name: coverage-html
    type: directory

  - path: allure-results
    name: allure-results
    type: directory

  - path: test-report.jsonl
    name: pytest-report-log

on_success:
  - ps: Write-Host "AppVeyor full UI suite succeeded."

on_failure:
  - ps: Write-Host "AppVeyor full UI suite failed."

on_finish:
  - ps: |
      $wc = New-Object "System.Net.WebClient"

      if (Test-Path ".\test-results.xml") {
        $wc.UploadFile("https://ci.appveyor.com/api/testresults/junit/$($env:APPVEYOR_JOB_ID)", (Resolve-Path ".\test-results.xml"))
      }
