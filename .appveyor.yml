# AppVeyor is the hosted Windows desktop UI gate for the FlaUI suite. The gate is
# trimmed (see test_script): the full UI suite runs only on pull requests and on
# master; routine feature-branch pushes run the fast tests/unit subset instead.
# Azure Pipelines owns linting, docs, packaging, deployment plumbing, and a
# smaller hosted Windows smoke job.
# Enable AppVeyor "Rolling builds" in project settings for pull requests so
# stale PR builds are cancelled when newer commits arrive. AppVeyor documents
# that setting as UI/API-level configuration, not an appveyor.yml key.
version: 1.0.{build}
image: Visual Studio 2026
build: off
skip_branch_with_pr: true

environment:
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Every supported Python runs on every build. FULL_UI marks the jobs that run the slow full
  # desktop UI suite where it gates a merge (pull requests and master; see test_script): the oldest
  # and newest supported versions plus 3.12. The 3.13 and 3.14 jobs always run the fast tests/unit
  # subset. WHEEL_SMOKE installs the built wheel into clean venvs outside the checkout and drives
  # the test apps from site-packages (scripts/wheel_smoke.py).
  # AppVeyor runs the jobs one after another, so the full-UI jobs come first and fast_finish stops
  # the build at the first failure.
  matrix:
    - job_name: Python 3.12 x64
      PYTHON_VERSION: "3.12"
      PYTHON_ARCH: "64"
      FULL_UI: "true"
      WHEEL_SMOKE: "true"

    - job_name: Python 3.11 x64
      PYTHON_VERSION: "3.11"
      PYTHON_ARCH: "64"
      FULL_UI: "true"

    - job_name: Python 3.15 x64
      PYTHON_VERSION: "3.15"
      PYTHON_ARCH: "64"
      FULL_UI: "true"

    - job_name: Python 3.13 x64 (unit)
      PYTHON_VERSION: "3.13"
      PYTHON_ARCH: "64"
      FULL_UI: "false"

    - job_name: Python 3.14 x64 (unit)
      PYTHON_VERSION: "3.14"
      PYTHON_ARCH: "64"
      FULL_UI: "false"

matrix:
  fast_finish: true

cache:
  - "%USERPROFILE%\\.cache\\uv -> uv.lock, pyproject.toml"
  - ".venv -> uv.lock, pyproject.toml"

init:
  - ps: |
      $env:UV_PYTHON = $env:PYTHON_VERSION
      $env:UV_PROJECT_ENVIRONMENT = "$env:APPVEYOR_BUILD_FOLDER\.venv"
      $env:UV_CACHE_DIR = "$env:USERPROFILE\.cache\uv"
      $env:UV_NO_PROGRESS = "1"
      Write-Host "AppVeyor full UI suite: Python $env:PYTHON_VERSION x$env:PYTHON_ARCH"
      $os = Get-CimInstance Win32_OperatingSystem
      Write-Host "Image: $env:APPVEYOR_BUILD_WORKER_IMAGE - $($os.Caption) $($os.Version) (build $($os.BuildNumber))"

install:
  - ps: |
      function Invoke-Checked {
        param([scriptblock] $Command)
        & $Command
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }

      irm https://astral.sh/uv/install.ps1 | iex
      $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
      $env:UV_NO_PROGRESS = "1"
      Invoke-Checked { uv --version }
      Invoke-Checked { uv --no-progress python install $env:PYTHON_VERSION }
      Invoke-Checked { uv --no-progress run --group unit-test --no-dev --package flaui-uiautomation-wrapper python --version }

test_script:
  - ps: |
      function Invoke-Checked {
        param([scriptblock] $Command)
        & $Command
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }

      $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
      $env:UV_PYTHON = $env:PYTHON_VERSION
      $env:UV_PROJECT_ENVIRONMENT = "$env:APPVEYOR_BUILD_FOLDER\.venv"
      $env:UV_CACHE_DIR = "$env:USERPROFILE\.cache\uv"
      $env:UV_NO_PROGRESS = "1"

      # Trim the gate: the slow full desktop UI suite only runs where it gates a merge
      # (pull requests, and pushes to master). Routine feature-branch pushes run the fast
      # unit subset only, so day-to-day turnaround does not pay for the full serial run.
      # Only the FULL_UI jobs (3.11, 3.12, 3.15) run it; 3.13 and 3.14 always run the unit subset.
      $gatesMerge = ($env:APPVEYOR_REPO_BRANCH -eq 'master') -or [bool]$env:APPVEYOR_PULL_REQUEST_NUMBER
      $runFull = $gatesMerge -and ($env:FULL_UI -eq 'true')
      if ($runFull) {
        Write-Host "Full gate: running the complete Windows desktop UI test suite with pytest..."
        Invoke-Checked { uv --no-progress run --group unit-test --no-dev --package flaui-uiautomation-wrapper --extra coverage coverage run -m pytest --junit-xml=test-results.xml --timeout=45 --timeout-method=thread --alluredir allure-results }
        # Enforce the coverage gate only on the full suite. The flag is passed explicitly here
        # (not via pyproject) so the fast unit subset and report/xml/html generation elsewhere
        # stay informational and do not fail on partial coverage.
        # v1.0 gate: 95% on the full UIA2/UIA3 x WinForms/WPF matrix. Unit-only coverage is ~88%;
        # the UI matrix carries automation_elements/application/input the rest of the way.
        Write-Host "Enforcing coverage gate (--fail-under=95)..."
        Invoke-Checked { uv --no-progress run --extra coverage coverage report --fail-under=95 }
      } else {
        Write-Host "Fast gate: running the unit subset only (the full UI suite runs on 3.11/3.12/3.15 for pull requests and master)..."
        Invoke-Checked { uv --no-progress run --group unit-test --no-dev --package flaui-uiautomation-wrapper --extra coverage coverage run -m pytest tests/unit --junit-xml=test-results.xml --timeout=45 --timeout-method=thread --alluredir allure-results }
      }

  # Clean wheel install: build the wheel, install it with no dev dependencies into fresh venvs
  # outside the checkout (a uv-managed CPython via uv pip, and the image's python.org Python via
  # pip), then run scripts/wheel_smoke.py in isolated mode so flaui can only come from
  # site-packages. The script checks the bundled DLLs, py.typed and the FlaUI version, then drives
  # the WPF/WinForms test apps on UIA2 and UIA3.
  - ps: |
      if ($env:WHEEL_SMOKE -ne 'true') { Write-Host "Wheel smoke runs on the 3.12 job only."; return }

      function Invoke-Checked {
        param([scriptblock] $Command)
        & $Command
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }

      $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
      $env:UV_CACHE_DIR = "$env:USERPROFILE\.cache\uv"
      $env:UV_NO_PROGRESS = "1"
      Remove-Item Env:UV_PYTHON -ErrorAction SilentlyContinue
      Remove-Item Env:UV_PROJECT_ENVIRONMENT -ErrorAction SilentlyContinue

      $repo = $env:APPVEYOR_BUILD_FOLDER
      $smokeRoot = Join-Path $env:TEMP "flaui-wheel-smoke"
      if (Test-Path $smokeRoot) { Remove-Item -Recurse -Force $smokeRoot }
      New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null

      Invoke-Checked { uv --no-progress build -q --wheel --out-dir "$smokeRoot\dist" $repo }
      $wheel = (Get-ChildItem "$smokeRoot\dist\*.whl" | Select-Object -First 1).FullName
      Write-Host "Built $wheel"

      # 1) uv-managed CPython, installed with uv pip.
      Invoke-Checked { uv --no-progress venv -q --managed-python --python $env:PYTHON_VERSION "$smokeRoot\uv-managed" }
      Invoke-Checked { uv --no-progress pip install -q --python "$smokeRoot\uv-managed\Scripts\python.exe" $wheel }

      # 2) The image's python.org install (C:\Python3XY-x64): the newest supported one, with pip.
      $system = Get-ChildItem "C:\Python3*-x64\python.exe" -ErrorAction SilentlyContinue |
        Where-Object { ($_.Directory.Name -match '^Python3(\d+)-x64$') -and ([int]$Matches[1] -ge 11) -and ([int]$Matches[1] -le 15) } |
        Sort-Object { [int]($_.Directory.Name -replace '^Python3(\d+)-x64$', '$1') } |
        Select-Object -Last 1
      if (-not $system) {
        Write-Host "No python.org Python 3.11-3.15 found under C:\Python3*-x64 on this image:"
        Get-ChildItem "C:\Python*" -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
        exit 1
      }
      Write-Host "System Python: $($system.FullName)"
      Invoke-Checked { & $system.FullName -m venv "$smokeRoot\system-pip" }
      Invoke-Checked { & "$smokeRoot\system-pip\Scripts\python.exe" -m pip install -q $wheel }

      # Run from outside the checkout in isolated mode (-I: no script dir, no user site, no PYTHON* env).
      Push-Location $smokeRoot
      try {
        foreach ($venv in @("uv-managed", "system-pip")) {
          Write-Host "=== Wheel smoke: $venv ==="
          Invoke-Checked { & "$smokeRoot\$venv\Scripts\python.exe" -I "$repo\scripts\wheel_smoke.py" --apps-dir "$repo\test_applications" }
        }
      } finally {
        Pop-Location
      }

after_test:
  - ps: |
      $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
      $env:UV_PYTHON = $env:PYTHON_VERSION
      $env:UV_PROJECT_ENVIRONMENT = "$env:APPVEYOR_BUILD_FOLDER\.venv"
      $env:UV_CACHE_DIR = "$env:USERPROFILE\.cache\uv"
      $env:UV_NO_PROGRESS = "1"
      Write-Host "Generating coverage reports..."
      if (Test-Path ".coverage") {
        # -q: coverage >= 7.17 writes "Wrote ... report" to stderr, which PowerShell's
        # NativeCommandError handling turns into a failed step.
        uv --no-progress run --with coverage coverage xml -q
        uv --no-progress run --with coverage coverage html -q
      } else {
        Write-Host "No coverage data found; skipping coverage report generation."
      }

artifacts:
  - path: test-results.xml
    name: test-results

  - path: coverage.xml
    name: coverage

  - path: htmlcov
    name: coverage-html
    type: directory

  - path: allure-results
    name: allure-results
    type: directory

  - path: test-report.jsonl
    name: pytest-report-log

on_success:
  - ps: Write-Host "AppVeyor full UI suite succeeded."

on_failure:
  - ps: Write-Host "AppVeyor full UI suite failed."

on_finish:
  - ps: |
      $wc = New-Object "System.Net.WebClient"

      if (Test-Path ".\test-results.xml") {
        $wc.UploadFile("https://ci.appveyor.com/api/testresults/junit/$($env:APPVEYOR_JOB_ID)", (Resolve-Path ".\test-results.xml"))
      }
