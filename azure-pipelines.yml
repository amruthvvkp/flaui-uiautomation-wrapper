# Azure Pipelines for the FlaUI Python wrapper.
# Azure owns fast validation, packaging, deployment plumbing, and a hosted
# Windows smoke job. AppVeyor remains the hosted full Windows desktop UI gate.

trigger:
  batch: true
  branches:
    include:
      - master
  tags:
    include:
      - v*

pr:
  autoCancel: true
  branches:
    include:
      - master

variables:
  UV_FROZEN: "1"
  UV_CACHE_DIR: "$(Pipeline.Workspace)/.uv-cache"
  UV_PROJECT_ENVIRONMENT: "$(Pipeline.Workspace)/.venv"
  WINDOWS_VM_IMAGE: "windows-2022"
  ACTIVE_PYTHON_VERSION: "3.12"
  DOCS_PYTHON_VERSION: "3.12"
  PACKAGE_PYTHON_VERSION: "3.12"
  # Target series for pre-releases. Beta numbers (1.0.0bN) are minted by the
  # `release-beta` GitHub Action on merge to master; PR builds publish dev versions
  # of this series (1.0.0.dev<buildId>) to TestPyPI.
  RELEASE_SERIES: "1.0.0"
  PUBLISH_TEST_PYPI: "false"
  PUBLISH_PYPI: "false"
  PUBLISH_DOCS: "false"

stages:
  - stage: ci
    displayName: CI
    jobs:
      - job: linting_checks
        displayName: Validations with Ruff and Interrogate
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UsePythonVersion@0
            displayName: Use Python $(PACKAGE_PYTHON_VERSION)
            inputs:
              versionSpec: "$(PACKAGE_PYTHON_VERSION)"

          - bash: |
              curl -LsSf https://astral.sh/uv/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.local/bin"
              "$HOME/.local/bin/uv" --version
            displayName: Install uv

          - task: Cache@2
            displayName: Restore uv cache
            inputs:
              key: 'uv | "$(Agent.OS)" | "$(PACKAGE_PYTHON_VERSION)" | uv.lock | pyproject.toml'
              restoreKeys: |
                uv | "$(Agent.OS)" | "$(PACKAGE_PYTHON_VERSION)"
                uv | "$(Agent.OS)"
              path: "$(UV_CACHE_DIR)"

          - bash: |
              uv run --group dev ruff check --no-fix --output-format=github flaui
            displayName: Run Ruff
            env:
              UV_FROZEN: "$(UV_FROZEN)"
              UV_CACHE_DIR: "$(UV_CACHE_DIR)"

          - bash: |
              uv run --group dev ty check flaui
            displayName: Run ty (type check)
            env:
              UV_FROZEN: "$(UV_FROZEN)"
              UV_CACHE_DIR: "$(UV_CACHE_DIR)"

          - bash: |
              uv run --group dev interrogate flaui --fail-under=95 --generate-badge badges/interrogate_badge.svg
            displayName: Run Interrogate
            env:
              UV_FROZEN: "$(UV_FROZEN)"
              UV_CACHE_DIR: "$(UV_CACHE_DIR)"

          - publish: badges/interrogate_badge.svg
            displayName: Publish Interrogate badge artifact
            artifact: interrogate-badge

          # Static analysis (GH-85). Configuration lives in pyproject.toml ([tool.pylint.*],
          # [tool.bandit], [tool.vulture]); the vulture public-API whitelist is vulture_whitelist.py.
          - bash: |
              uv run --group dev pylint flaui --fail-under=9.5
            displayName: Run Pylint (score >= 9.5)
            env:
              UV_FROZEN: "$(UV_FROZEN)"
              UV_CACHE_DIR: "$(UV_CACHE_DIR)"

          - bash: |
              uv run --group dev bandit -c pyproject.toml -r flaui
            displayName: Run Bandit (security lint)
            env:
              UV_FROZEN: "$(UV_FROZEN)"
              UV_CACHE_DIR: "$(UV_CACHE_DIR)"

          - bash: |
              uv run --group dev vulture
            displayName: Run Vulture (dead code)
            env:
              UV_FROZEN: "$(UV_FROZEN)"
              UV_CACHE_DIR: "$(UV_CACHE_DIR)"

      - job: docs_strict
        displayName: Build documentation strict
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UsePythonVersion@0
            displayName: Use Python $(DOCS_PYTHON_VERSION)
            inputs:
              versionSpec: "$(DOCS_PYTHON_VERSION)"

          - bash: |
              curl -LsSf https://astral.sh/uv/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.local/bin"
              "$HOME/.local/bin/uv" --version
            displayName: Install uv

          - task: Cache@2
            displayName: Restore uv cache
            inputs:
              key: 'uv-docs | "$(Agent.OS)" | "$(DOCS_PYTHON_VERSION)" | uv.lock | pyproject.toml'
              restoreKeys: |
                uv-docs | "$(Agent.OS)" | "$(DOCS_PYTHON_VERSION)"
                uv-docs | "$(Agent.OS)"
              path: "$(UV_CACHE_DIR)"

          - bash: |
              uv sync --group docs
              uv run python scripts/extract_versions.py
              uv run python scripts/build_changelog.py
              uv run zensical build --strict -f zensical.toml
            displayName: Build docs
            env:
              UV_FROZEN: "$(UV_FROZEN)"
              UV_CACHE_DIR: "$(UV_CACHE_DIR)"

          - publish: site
            displayName: Publish docs site artifact
            artifact: docs-site

      - job: windows_smoke_tests
        displayName: Windows hosted smoke
        pool:
          vmImage: $(WINDOWS_VM_IMAGE)

        # Every supported Python on windows-2022 (Windows Server 2022), plus the oldest and newest
        # on windows-2025 (Windows Server 2025). The full desktop UI suite runs on AppVeyor
        # (Visual Studio 2026 image); see docs/contributing/development.md for the coverage table.
        # The interpreter is a uv-managed CPython, so new Python releases do not wait on the
        # hosted-image tool cache.
        strategy:
          matrix:
            Windows2022_Python311:
              WINDOWS_VM_IMAGE: "windows-2022"
              ACTIVE_PYTHON_VERSION: "3.11"
              SMOKE_LEG: "win2022-py311"
            Windows2022_Python312:
              WINDOWS_VM_IMAGE: "windows-2022"
              ACTIVE_PYTHON_VERSION: "3.12"
              SMOKE_LEG: "win2022-py312"
            Windows2022_Python313:
              WINDOWS_VM_IMAGE: "windows-2022"
              ACTIVE_PYTHON_VERSION: "3.13"
              SMOKE_LEG: "win2022-py313"
            Windows2022_Python314:
              WINDOWS_VM_IMAGE: "windows-2022"
              ACTIVE_PYTHON_VERSION: "3.14"
              SMOKE_LEG: "win2022-py314"
            Windows2022_Python315:
              WINDOWS_VM_IMAGE: "windows-2022"
              ACTIVE_PYTHON_VERSION: "3.15"
              SMOKE_LEG: "win2022-py315"
            Windows2025_Python311:
              WINDOWS_VM_IMAGE: "windows-2025"
              ACTIVE_PYTHON_VERSION: "3.11"
              SMOKE_LEG: "win2025-py311"
            Windows2025_Python315:
              WINDOWS_VM_IMAGE: "windows-2025"
              ACTIVE_PYTHON_VERSION: "3.15"
              SMOKE_LEG: "win2025-py315"

        steps:
          - checkout: self
            fetchDepth: 0

          - pwsh: |
              irm https://astral.sh/uv/install.ps1 | iex
              $uvPath = "$env:USERPROFILE\.local\bin"
              Write-Host "##vso[task.prependpath]$uvPath"
              & "$uvPath\uv.exe" --version
            displayName: Install uv

          - pwsh: |
              $os = Get-CimInstance Win32_OperatingSystem
              Write-Host "Image: $(WINDOWS_VM_IMAGE) - $($os.Caption) $($os.Version) (build $($os.BuildNumber))"
              uv python install $(ACTIVE_PYTHON_VERSION)
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              uv run --no-project --python $(ACTIVE_PYTHON_VERSION) python -c "import platform, struct, sys; print(sys.executable); print(platform.python_version(), '{}-bit'.format(struct.calcsize('P') * 8))"
            displayName: Install and show Python $(ACTIVE_PYTHON_VERSION) x64
            env:
              UV_CACHE_DIR: "$(UV_CACHE_DIR)"

          - task: Cache@2
            displayName: Restore uv cache
            inputs:
              key: 'uv | "$(Agent.OS)" | "$(ACTIVE_PYTHON_VERSION)" | uv.lock | pyproject.toml'
              restoreKeys: |
                uv | "$(Agent.OS)" | "$(ACTIVE_PYTHON_VERSION)"
                uv | "$(Agent.OS)"
              path: "$(UV_CACHE_DIR)"

          - task: Cache@2
            displayName: Restore project virtualenv cache
            inputs:
              key: 'uv-venv | "$(WINDOWS_VM_IMAGE)" | "$(ACTIVE_PYTHON_VERSION)" | uv.lock | pyproject.toml'
              restoreKeys: |
                uv-venv | "$(WINDOWS_VM_IMAGE)" | "$(ACTIVE_PYTHON_VERSION)"
              path: "$(UV_PROJECT_ENVIRONMENT)"

          - pwsh: |
              uv run --group unit-test --no-dev --package flaui-uiautomation-wrapper --extra coverage coverage run -m pytest tests/unit/lib tests/unit/core/test_identifiers.py --junit-xml=test-results.xml --timeout=45 --timeout-method=thread --alluredir allure-results
            displayName: Run pytest hosted smoke suite
            env:
              UV_PYTHON: "$(ACTIVE_PYTHON_VERSION)"
              UV_FROZEN: "$(UV_FROZEN)"
              UV_CACHE_DIR: "$(UV_CACHE_DIR)"
              UV_PROJECT_ENVIRONMENT: "$(UV_PROJECT_ENVIRONMENT)"

          - pwsh: |
              $parallelCoverage = @(Get-ChildItem -Path . -Force -Filter ".coverage.*" -ErrorAction SilentlyContinue)
              $baseCoverage = Test-Path ".coverage"
              if ($parallelCoverage.Count -gt 0) {
                uv run --with coverage coverage combine
                $baseCoverage = Test-Path ".coverage"
              }

              if ($baseCoverage) {
                uv run --with coverage coverage xml -q
                uv run --with coverage coverage html -q
              } else {
                Write-Host "No coverage data found; writing placeholder coverage artifacts."
                $coverageXml = '<?xml version="1.0" ?><coverage version="0" timestamp="0" lines-valid="0" lines-covered="0" line-rate="0" branches-covered="0" branches-valid="0" branch-rate="0" complexity="0"><sources /><packages /></coverage>'
                Set-Content -Path coverage.xml -Value $coverageXml -Encoding UTF8
                New-Item -ItemType Directory -Force -Path htmlcov | Out-Null
                Set-Content -Path htmlcov\index.html -Value "<html><body>No coverage data generated.</body></html>" -Encoding UTF8
              }
            displayName: Generate coverage reports
            condition: succeededOrFailed()
            env:
              UV_PYTHON: "$(ACTIVE_PYTHON_VERSION)"
              UV_FROZEN: "$(UV_FROZEN)"
              UV_CACHE_DIR: "$(UV_CACHE_DIR)"
              UV_PROJECT_ENVIRONMENT: "$(UV_PROJECT_ENVIRONMENT)"

          - pwsh: |
              New-Item -ItemType Directory -Force -Path htmlcov | Out-Null
              New-Item -ItemType Directory -Force -Path allure-results | Out-Null
              if (!(Test-Path htmlcov\index.html)) {
                Set-Content -Path htmlcov\index.html -Value "<html><body>No HTML coverage generated.</body></html>" -Encoding UTF8
              }
              if (!(Test-Path test-report.jsonl)) {
                New-Item -ItemType File -Path test-report.jsonl | Out-Null
              }
              if (!(Test-Path test-results.xml)) {
                Set-Content -Path test-results.xml -Value "<testsuites />" -Encoding UTF8
              }
              if (!(Test-Path coverage.xml)) {
                $coverageXml = '<?xml version="1.0" ?><coverage version="0" timestamp="0" lines-valid="0" lines-covered="0" line-rate="0" branches-covered="0" branches-valid="0" branch-rate="0" complexity="0"><sources /><packages /></coverage>'
                Set-Content -Path coverage.xml -Value $coverageXml -Encoding UTF8
              }
            displayName: Prepare publishable test artifacts
            condition: succeededOrFailed()

          - task: PublishTestResults@2
            displayName: Publish pytest results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: test-results.xml
              failTaskOnFailedTests: true
              failTaskOnMissingTestResultsFile: false
              testRunTitle: $(WINDOWS_VM_IMAGE) Python $(ACTIVE_PYTHON_VERSION) x64 hosted smoke tests

          - task: PublishCodeCoverageResults@2
            displayName: Publish coverage
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: "$(System.DefaultWorkingDirectory)/coverage.xml"
              pathToSources: "$(System.DefaultWorkingDirectory)"

          - publish: htmlcov
            displayName: Publish HTML coverage artifact
            condition: succeededOrFailed()
            artifact: coverage-html-$(SMOKE_LEG)

          - publish: allure-results
            displayName: Publish Allure results artifact
            condition: succeededOrFailed()
            artifact: allure-results-$(SMOKE_LEG)

          - publish: test-report.jsonl
            displayName: Publish pytest report log artifact
            condition: succeededOrFailed()
            artifact: pytest-report-log-$(SMOKE_LEG)

          - publish: test-results.xml
            displayName: Publish raw JUnit artifact
            condition: succeededOrFailed()
            artifact: test-results-$(SMOKE_LEG)

      - job: wheel_install_smoke
        displayName: Clean wheel install smoke
        # Build the wheel, install it with no dev dependencies into fresh venvs outside the checkout,
        # and run scripts/wheel_smoke.py in isolated mode so flaui can only come from site-packages.
        # Hosted Azure agents have no interactive desktop for the test apps, so this job runs the
        # packaging and PythonNet checks; AppVeyor repeats it with the WPF/WinForms apps on UIA2/UIA3.
        # Installation types: the hosted image's tool-cache CPython with pip, and uv-managed CPython
        # (oldest and newest supported) with uv pip.
        pool:
          vmImage: windows-2022
        steps:
          - checkout: self
            fetchDepth: 1

          - task: UsePythonVersion@0
            displayName: Use tool-cache Python $(PACKAGE_PYTHON_VERSION) x64
            inputs:
              versionSpec: "$(PACKAGE_PYTHON_VERSION)"
              architecture: x64

          - pwsh: |
              irm https://astral.sh/uv/install.ps1 | iex
              $uvPath = "$env:USERPROFILE\.local\bin"
              Write-Host "##vso[task.prependpath]$uvPath"
              & "$uvPath\uv.exe" --version
            displayName: Install uv

          - pwsh: |
              function Invoke-Checked {
                param([scriptblock] $Command)
                & $Command
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }

              $repo = "$(Build.SourcesDirectory)"
              $smokeRoot = Join-Path "$(Agent.TempDirectory)" "flaui-wheel-smoke"
              New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null

              Invoke-Checked { uv build -q --wheel --out-dir "$smokeRoot\dist" $repo }
              $wheel = (Get-ChildItem "$smokeRoot\dist\*.whl" | Select-Object -First 1).FullName
              Write-Host "Built $wheel"

              # Tool-cache CPython (UsePythonVersion) with plain pip.
              $toolCachePython = (Get-Command python).Source
              Write-Host "Tool-cache Python: $toolCachePython"
              Invoke-Checked { & $toolCachePython -m venv "$smokeRoot\toolcache-pip" }
              Invoke-Checked { & "$smokeRoot\toolcache-pip\Scripts\python.exe" -m pip install -q $wheel }
              $venvs = @("toolcache-pip")

              # uv-managed CPython, oldest and newest supported, with uv pip.
              foreach ($version in @("3.11", "3.15")) {
                $name = "uv-managed-$version"
                Invoke-Checked { uv venv -q --managed-python --python $version "$smokeRoot\$name" }
                Invoke-Checked { uv pip install -q --python "$smokeRoot\$name\Scripts\python.exe" $wheel }
                $venvs += $name
              }

              # Run from outside the checkout in isolated mode (-I: no script dir, no user site, no PYTHON* env).
              Push-Location $smokeRoot
              try {
                foreach ($venv in $venvs) {
                  Write-Host "=== Wheel smoke: $venv ==="
                  Invoke-Checked { & "$smokeRoot\$venv\Scripts\python.exe" -I "$repo\scripts\wheel_smoke.py" }
                }
              } finally {
                Pop-Location
              }
            displayName: Build wheel, install into clean venvs, run smoke
            env:
              UV_CACHE_DIR: "$(UV_CACHE_DIR)"
              UV_NO_PROGRESS: "1"
              PIP_DISABLE_PIP_VERSION_CHECK: "1"

  - stage: package
    displayName: Package
    dependsOn: ci
    condition: succeeded()
    jobs:
      - job: build_distribution
        displayName: Build Python distributions
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UsePythonVersion@0
            displayName: Use Python $(PACKAGE_PYTHON_VERSION)
            inputs:
              versionSpec: "$(PACKAGE_PYTHON_VERSION)"

          - bash: |
              curl -LsSf https://astral.sh/uv/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.local/bin"
              "$HOME/.local/bin/uv" --version
            displayName: Install uv

          - bash: |
              set -euo pipefail
              SHORT_SHA="$(Build.SourceVersion)"
              SHORT_SHA="${SHORT_SHA:0:7}"
              BASE_VERSION="$(uv version --short)"
              # Version selection by build context:
              #   tag refs/tags/v*  -> the tag's version (authoritative; e.g. 1.0.0b3). The beta
              #                        tag is minted by the release-beta GitHub Action on merge.
              #   pull request      -> PEP 440 dev release of the target series (1.0.0.dev<buildId>),
              #                        uploaded to TestPyPI. No local '+sha' segment: PyPI rejects it.
              #   other (master CI) -> local dev version for the build artifact only (not published).
              if [[ "$(Build.SourceBranch)" == refs/tags/v* ]]; then
                PACKAGE_VERSION="$(Build.SourceBranchName)"
                PACKAGE_VERSION="${PACKAGE_VERSION#v}"
              elif [[ "$(Build.Reason)" == "PullRequest" ]]; then
                PACKAGE_VERSION="$(RELEASE_SERIES).dev$(Build.BuildId)"
              else
                PACKAGE_VERSION="${BASE_VERSION}+g${SHORT_SHA}"
              fi
              uv version --frozen "$PACKAGE_VERSION"
              echo "Building package version ${PACKAGE_VERSION}"
              uv build
              echo "##vso[task.setvariable variable=PACKAGE_VERSION]${PACKAGE_VERSION}"
            displayName: Set package version and build
            env:
              UV_FROZEN: "$(UV_FROZEN)"
              UV_CACHE_DIR: "$(UV_CACHE_DIR)"

          - publish: dist
            displayName: Publish distribution artifact
            artifact: python-dist

  - stage: deploy_testpypi
    displayName: Deploy to TestPyPI
    dependsOn: package
    # Publish a dev build to TestPyPI on every pull request, so reviewers can install the
    # candidate (pip install -i https://test.pypi.org/simple/ ...). Each build mints a unique
    # 1.0.0.dev<buildId> version, so re-uploads never collide.
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'), eq(variables['PUBLISH_TEST_PYPI'], 'true'))
    jobs:
      - deployment: publish_testpypi
        displayName: Publish to TestPyPI
        environment: test-pypi
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: python-dist

                - task: UsePythonVersion@0
                  displayName: Use Python $(PACKAGE_PYTHON_VERSION)
                  inputs:
                    versionSpec: "$(PACKAGE_PYTHON_VERSION)"

                - bash: |
                    python -m pip install --upgrade twine
                    python -m twine upload --repository-url https://test.pypi.org/legacy/ --username __token__ --password "$TEST_PYPI_API_TOKEN" "$(Pipeline.Workspace)"/python-dist/*
                  displayName: Upload to TestPyPI
                  env:
                    TEST_PYPI_API_TOKEN: "$(TEST_PYPI_API_TOKEN)"

  - stage: deploy_pypi
    displayName: Deploy to PyPI
    dependsOn: package
    # Fires on any v* tag. Beta tags (v1.0.0bN) are pushed by the release-beta GitHub Action on
    # merge to master; the stable v1.0.0 tag is pushed manually. PyPI auto-classifies 1.0.0bN as a
    # pre-release (only installed with --pre), so the same path serves betas and the final release.
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'), eq(variables['PUBLISH_PYPI'], 'true'))
    jobs:
      - deployment: publish_pypi
        displayName: Publish to PyPI
        environment: pypi
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: python-dist

                - task: UsePythonVersion@0
                  displayName: Use Python $(PACKAGE_PYTHON_VERSION)
                  inputs:
                    versionSpec: "$(PACKAGE_PYTHON_VERSION)"

                - bash: |
                    python -m pip install --upgrade twine
                    python -m twine upload --username __token__ --password "$PYPI_API_TOKEN" "$(Pipeline.Workspace)"/python-dist/*
                  displayName: Upload to PyPI
                  env:
                    PYPI_API_TOKEN: "$(PYPI_API_TOKEN)"

  - stage: deploy_docs
    displayName: Deploy versioned docs to GitHub Pages
    dependsOn: ci
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['PUBLISH_DOCS'], 'true'))
    jobs:
      - deployment: publish_docs
        displayName: Publish versioned docs (mike)
        environment: github-pages
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                # Need the full repo (not just the built artifact): mike commits the
                # generated site onto the gh-pages branch, so it builds from source here.
                - checkout: self
                  fetchDepth: 0
                  persistCredentials: true

                - task: UsePythonVersion@0
                  displayName: Use Python $(DOCS_PYTHON_VERSION)
                  inputs:
                    versionSpec: "$(DOCS_PYTHON_VERSION)"

                - bash: |
                    curl -LsSf https://astral.sh/uv/install.sh | sh
                    echo "##vso[task.prependpath]$HOME/.local/bin"
                    "$HOME/.local/bin/uv" --version
                  displayName: Install uv

                - bash: |
                    set -euo pipefail
                    # Tag build (refs/tags/vX.Y.Z) -> release version, alias `stable` (becomes default).
                    # master build               -> rolling `dev` version, alias `latest`.
                    if [[ "$(Build.SourceBranch)" == refs/tags/v* ]]; then
                      VERSION="${BUILD_SOURCEBRANCHNAME#v}"
                      ALIAS="stable"
                      SET_DEFAULT="true"
                    else
                      VERSION="dev"
                      ALIAS="latest"
                      SET_DEFAULT="false"
                    fi
                    echo "Publishing docs version='${VERSION}' alias='${ALIAS}' set_default=${SET_DEFAULT}"
                    echo "##vso[task.setvariable variable=DOCS_VERSION]${VERSION}"
                    echo "##vso[task.setvariable variable=DOCS_ALIAS]${ALIAS}"
                    echo "##vso[task.setvariable variable=DOCS_SET_DEFAULT]${SET_DEFAULT}"
                  displayName: Resolve docs version and alias

                - bash: |
                    set -euo pipefail
                    if [ -z "${GITHUB_PAGES_TOKEN:-}" ]; then
                      echo "GITHUB_PAGES_TOKEN must be configured as a secret pipeline variable."
                      exit 1
                    fi

                    git config --global user.email "azure-pipelines@users.noreply.github.com"
                    git config --global user.name "Azure Pipelines"
                    # Tokenised origin so mike can push the gh-pages branch.
                    git remote set-url origin "https://x-access-token:${GITHUB_PAGES_TOKEN}@github.com/amruthvvkp/flaui-uiautomation-wrapper.git"

                    # Regenerate the bundled-versions include and the live changelog the docs
                    # build depends on (both are gitignored, generated artifacts).
                    uv sync --group docs
                    uv run python scripts/extract_versions.py
                    uv run python scripts/build_changelog.py

                    # mike (Zensical's fork) builds the docs and commits them to gh-pages, keeping
                    # each version under its own subdir and updating the moving alias. It is installed
                    # on the fly from GitHub (intentionally not published to PyPI).
                    MIKE_SPEC="mike @ git+https://github.com/squidfunk/mike.git"
                    uv run --group docs --with "$MIKE_SPEC" \
                      mike deploy --push --update-aliases "$DOCS_VERSION" "$DOCS_ALIAS"

                    if [ "$DOCS_SET_DEFAULT" = "true" ]; then
                      uv run --with "$MIKE_SPEC" mike set-default --push "$DOCS_ALIAS"
                    fi
                  displayName: Publish versioned docs with mike
                  env:
                    GITHUB_PAGES_TOKEN: "$(GITHUB_PAGES_TOKEN)"
                    UV_CACHE_DIR: "$(UV_CACHE_DIR)"
