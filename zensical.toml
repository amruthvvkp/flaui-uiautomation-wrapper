# Zensical configuration for the FlaUI for Python documentation site.
# Migrated from mkdocs.yml. See https://zensical.org/docs/ for reference.

[project]
site_name = "FlaUI for Python"
site_description = "Complete Windows UI Automation for Python with 1:1 FlaUI parity"
site_url = "https://amruthvvkp.github.io/flaui-uiautomation-wrapper"
repo_url = "https://github.com/amruthvvkp/flaui-uiautomation-wrapper"
repo_name = "amruthvvkp/flaui-uiautomation-wrapper"
edit_uri = ""

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js"]

nav = [
  { "Home" = "index.md" },
  { "Motivation" = "motivation.md" },
  { "Basics" = "basics.md" },
  { "UIA2 vs UIA3" = "uia2-uia3.md" },
  { "Advanced" = "advanced.md" },
  { "API Reference" = [
    { "Overview" = "api/index.md" },
    { "Core" = [
      { "Automation" = "api/automation.md" },
      { "AutomationBase (UIA facades)" = "api/automation_base.md" },
      { "Application" = "api/application.md" },
      { "Condition Factory" = "api/condition_factory.md" },
      { "Automation Element" = "api/automation_element.md" },
      { "Identifiers" = "api/identifiers.md" },
      { "Patterns" = "api/patterns.md" },
    ] },
    { "Input" = [
      { "Mouse" = "api/mouse.md" },
      { "Keyboard" = "api/keyboard.md" },
      { "Wait" = "api/wait.md" },
    ] },
    { "Tools" = [
      { "Retry" = "api/retry.md" },
      { "Cache Request" = "api/cache_request.md" },
      { "Drawing" = "api/drawing.md" },
      { "Collections" = "api/collections.md" },
      { "Exceptions" = "api/exceptions.md" },
    ] },
    { "Elements" = [
      { "Button" = "api/elements/button.md" },
      { "Calendar" = "api/elements/calendar.md" },
      { "CheckBox" = "api/elements/checkbox.md" },
      { "ComboBox" = "api/elements/combobox.md" },
      { "ComboBoxItem" = "api/elements/combobox_item.md" },
      { "DataGridView" = "api/elements/datagridview.md" },
      { "DateTimePicker" = "api/elements/datetimepicker.md" },
      { "Grid" = "api/elements/grid.md" },
      { "Label" = "api/elements/label.md" },
      { "ListBox" = "api/elements/listbox.md" },
      { "ListBoxItem" = "api/elements/listbox_item.md" },
      { "Menu" = "api/elements/menu.md" },
      { "MenuItem" = "api/elements/menu_item.md" },
      { "ProgressBar" = "api/elements/progressbar.md" },
      { "RadioButton" = "api/elements/radiobutton.md" },
      { "Slider" = "api/elements/slider.md" },
      { "Spinner" = "api/elements/spinner.md" },
      { "Tab" = "api/elements/tab.md" },
      { "TabItem" = "api/elements/tab_item.md" },
      { "TextBox" = "api/elements/textbox.md" },
      { "Thumb" = "api/elements/thumb.md" },
      { "TitleBar" = "api/elements/titlebar.md" },
      { "ToggleButton" = "api/elements/togglebutton.md" },
      { "Tree" = "api/elements/tree.md" },
      { "TreeItem" = "api/elements/tree_item.md" },
      { "Window" = "api/elements/window.md" },
    ] },
  ] },
  { "Concepts" = "concepts.md" },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Agentic Guidelines" = "agentic-guidelines.md" },
  { "Contributing" = [
    { "Guide" = "contributing.md" },
    { "Development Workflow" = "contributing/development.md" },
    { "Testing" = "contributing/testing.md" },
    { "Porting C# Tests" = "contributing/porting-tests.md" },
    { "Bug Tracking" = "bug-tracking.md" },
  ] },
  { "Examples" = [
    { "Pytest" = "examples/pytest.md" },
    { "Unittest" = "examples/unittest.md" },
    { "Robot Framework" = "examples/robot-framework.md" },
    { "Behave" = "examples/behave.md" },
    { "TestPlan" = "examples/testplan.md" },
    { "Element Cookbook" = "examples/element-cookbook.md" },
  ] },
]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]
language = "en"
logo = "logo.png"
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.indexes",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "search.highlight",
  "search.suggest",
  "toc.follow",
  "toc.integrate",
]

[[project.theme.palette]]
scheme = "default"
primary = "deep purple"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "deep purple"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# Plugins
# ----------------------------------------------------------------------------
[project.plugins.search]

[project.plugins.minify]
minify_html = true

[project.plugins.redirects]

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
show_root_heading = true
show_root_toc_entry = false
show_symbol_type_heading = true
heading_level = 2
merge_init_into_class = true
docstring_style = "sphinx"

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------
[project.markdown_extensions.admonition]

[project.markdown_extensions.toc]
permalink = false

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
