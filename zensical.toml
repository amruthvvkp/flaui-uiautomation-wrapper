# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]
language = "en"
logo = "logo.png"
favicon = "logo.png"
custom_dir = "overrides"
features = [
  "header.autohide",
  "announce.dismiss",
  "navigation.instant",
  "navigation.tracking",
  "navigation.indexes",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "search.highlight",
  "search.suggest",
  "toc.follow",
  "toc.integrate",
  "navigation.footer",
]

[[project.theme.palette]]
scheme = "default"
primary = "white"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "black"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# Footer / extras
# ----------------------------------------------------------------------------
[project.extra]
# Drop the "Made with Zensical" notice; the footer carries the copyright,
# a "Star us on GitHub" call-to-action, and the social links below instead.
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/amruthvvkp/flaui-uiautomation-wrapper"
name = "FlaUI for Python on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/flaui-uiautomation-wrapper/"
name = "FlaUI for Python on PyPI"

# ----------------------------------------------------------------------------
# Documentation versioning (mike)
# ----------------------------------------------------------------------------
# Enables the version selector in the header. Versions are published to GitHub
# Pages with mike (Zensical's fork). Aliases used by this project:
#   latest  -> docs built from `master` (in-development)
#   stable  -> the most recent released version (set as default at v1.0.0)
# Until v1.0.0 ships, `latest` remains the default landing version.
# See docs/release-plan.md ("Documentation versioning") for the workflow.
[project.extra.version]
provider = "mike"
alias = true

# ----------------------------------------------------------------------------
# Plugins
# ----------------------------------------------------------------------------
[project.plugins.search]

[project.plugins.minify]
minify_html = true

[project.plugins.redirects]

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
show_root_heading = true
show_root_toc_entry = false
show_symbol_type_heading = true
heading_level = 2
merge_init_into_class = true
docstring_style = "sphinx"

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------
[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.def_list]

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.toc]
permalink = false

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
