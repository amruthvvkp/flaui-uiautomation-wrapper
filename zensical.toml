repo_name = "amruthvvkp/flaui-uiautomation-wrapper"
edit_uri = ""
copyright = 'Copyright &copy; 2024&ndash;2026 Amruth VVKP &amp; contributors &middot; <a href="https://github.com/amruthvvkp/flaui-uiautomation-wrapper">Star us on GitHub</a>'

