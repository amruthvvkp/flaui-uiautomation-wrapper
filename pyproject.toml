[project]
name = "flaui-uiautomation-wrapper"
version = "0.1.0"
description = "Tool to perform UI Automation on Windows desktop applications using an underlying FlaUI wrapper."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "arrow>=1.3.0",
  "pillow>=12.2.0",
  "pydantic>=2.10.6",
  "pydantic-settings>=2.7.1",
  "pythonnet==3.1.0",
]
authors = [
  { name = "Amruth VVKP", email = "amruthvvkp@gmail.com" },
  { name = "Varshith VVS", email = "svvarsham@gmail.com" },
  { name = "Tejaswani Sathish Kumar", email = "tejaswani12.92@gmail.com" },
]
license = { text = "LGPL-3.0-or-later" }
keywords = [
  "automation",
  "desktop automation",
  "flaui",
  "qa",
  "testing",
  "ui",
  "ui-automation",
  "windows",
  "windows automation",
  "windows testing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Testing",
  "Topic :: Utilities",
  "Typing :: Typed",
]

[project.optional-dependencies]
coverage = ["coverage>=7.6.1"]
pytest-sugar = ["pytest-sugar>=1.0.0"]

[dependency-groups]
dev = [
  "interrogate>=1.7.0",
  "isort>=8.0.1",
  "jupyter>=1.1.1",
  "mypy>=2.1.0",
  "pre-commit>=4.6.0",
  "ruff>=0.9.3",
]
docs = [
  "jinja2>=3.1.6",
  "mike>=2.2.0",
  "mkdocs>=1.6.1",
  "mkdocs-awesome-pages-plugin>=2.10.1",
  "mkdocs-material>=9.7.1",
  "mkdocs-mermaid2-plugin>=1.2.3",
  "mkdocs-minify-plugin>=0.8.0",
  "mkdocs-redirects>=1.2.3",
  "mkdocstrings[python]>=1.0.4",
  "pymdown-extensions>=11.0",
  "pyyaml>=6.0.3",
]
unit-test = [
  "allure-pytest>=2.16.0",
  "dirty-equals>=0.11",
  "loguru>=0.7.3",
  "psutil>=6.1.1",
  "pyhamcrest>=2.1.0",
  "pytest>=8.3.4",
  "pytest-bug>=1.4.0",
  "pytest-pretty>=1.2.0",
  "pytest-reportlog>=0.4.0",
  "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
# https://github.com/psf/black
line-length = 120
exclude = '''
(
  /(
    \.git
    | \.mypy_cache
    | \.pytest_cache
    | htmlcov
    | venv
    | .venv
  )/
)
'''

[tool.coverage.run]
disable_warnings = ["no-data-collected"]
branch = true
source = ["flaui"]
command_line = "-m pytest"
relative_files = true

[tool.coverage.html]
directory = "htmlcov"
skip_empty = true
title = "FlaUI Python Wrapper Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.lcov]
output = "coverage.lcov"

[tool.coverage.report]
exclude_also = []
omit = []

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203"]
max-complexity = 10

[tool.hatch.build.targets.wheel]
only-include = ["/README.md", "/flaui", "flaui/bin/*.dll"]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = true
ignore-setters = false
fail-under = 95
exclude = ["docs", "build"]
ignore-regex = ["^get$", "^mock_.*", ".*BaseClass.*"]
verbose = 2
quiet = false
whitelist-regex = []
color = true
omit-covered-files = false

[tool.isort]
profile = "black"
known_third_party = ["pydantic"]
skip = [".gitignore", ".dockerignore"]
extend_skip = [".md", ".json"]
line_length = 120
skip_gitignore = true
length_sort_straight = true
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
ensure_newline_before_comments = true
use_parentheses = true
py_version = 310

[tool.mypy]
strict = false
plugins = ["pydantic.mypy"]

follow_imports = "skip"
warn_redundant_casts = true
no_implicit_reexport = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = false
warn_required_dynamic_aliases = true
warn_untyped_fields = false

[tool.pytest.ini_options]
addopts = "-ra -q -p no:warnings --report-log=test-report.jsonl"
markers = [
  "wpf_only: Tests that only run on WPF applications",
  "winforms_only: Tests that only run on WinForms applications",
  "uia3_only: Tests that require UIA3 automation type",
  "platform_limitation: Known C# FlaUI platform limitation",
  "windows11: Tests affected by Windows 11 specific behavior",
  "bug: Known bug tracked in GitHub issues (use id and url parameters)",
]
minversion = "8.0"
testpaths = ["tests/"]
# Timeout settings - prevent hanging tests in UI automation
timeout = 30  # Default 30s per test (UI tests can be slow)
timeout_method = "thread"  # Use thread method on Windows for reliability
session_timeout = 1800  # 30 minutes max for full suite

[tool.ruff]
# Group violations by containing file.
respect-gitignore = true
src = ["flaui"]

# Same as Black.
line-length = 120

# Assume Python 3.10.
target-version = "py310"
fix = true

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
ignore = [
  "E501",  # line too long, handled by black
  "B904",  # Within an except clause, raise exceptions with raise ... from err or raise ... from None to distinguish them from errors in exception handling
  "B008",  # Do not perform function call {name} in argument defaults
  "B006",  # Do not use mutable data structures for argument defaults
  "C901",  # too complex
  "E402",  # Module level import not at top of file
]

select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  # "I",  # isort
  "B",  # flake8-bugbear
]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.isort]
order-by-type = true
combine-as-imports = true
force-sort-within-sections = true
lines-after-imports = 1
force-single-line = false
split-on-trailing-comma = false
known-third-party = ["pydantic"]

[tool.uv.sources]
flaui = { path = "./flaui" }
