[project]
name = "flaui-uiautomation-wrapper"
version = "1.0.0"
description = "Tool to perform UI Automation on Windows desktop applications using an underlying FlaUI wrapper."
readme = "README.md"
requires-python = ">=3.11,<3.16"
dependencies = [
  "arrow>=1.3.0",
  "pillow>=10.4.0",
  "psutil>=6.1.1",
  "pydantic>=2.10.6",
  "pydantic-settings>=2.7.1",
  "pythonnet==3.2.1",
]
authors = [
  { name = "Amruth VVKP", email = "amruthvvkp@gmail.com" },
  { name = "Varshith VVS", email = "svvarsham@gmail.com" },
  { name = "Tejaswani Sathish Kumar", email = "tejaswani12.92@gmail.com" },
]
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING"]
keywords = [
  "automation",
  "desktop automation",
  "flaui",
  "qa",
  "testing",
  "ui",
  "ui-automation",
  "windows",
  "windows automation",
  "windows testing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Utilities",
  "Typing :: Typed",
]

[project.urls]
Changelog = "https://github.com/amruthvvkp/flaui-uiautomation-wrapper/releases"
Documentation = "https://amruthvvkp.github.io/flaui-uiautomation-wrapper"
Homepage = "https://amruthvvkp.github.io/flaui-uiautomation-wrapper"
Issues = "https://github.com/amruthvvkp/flaui-uiautomation-wrapper/issues"
Repository = "https://github.com/amruthvvkp/flaui-uiautomation-wrapper"

[project.optional-dependencies]
coverage = ["coverage>=7.17.5"]
pytest-sugar = ["pytest-sugar>=1.0.0"]

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "interrogate>=1.7.0",
  "isort>=9.0.2",
  "jupyter>=1.1.1",
  "pre-commit>=4.7.0",
  "pylint>=4.1.4",
  "ruff>=0.17.6",
  "ty>=0.0.110",
  "vulture>=2.16",
]
# Docs toolchain (Zensical). Docs are built on 3.12 in CI.
docs = [
  "mkdocstrings-python>=1.18.2",
  "pymdown-extensions>=10.20.1",
  "zensical>=0.0.46",
]
unit-test = [
  "allure-pytest>=2.16.2",
  "dirty-equals>=0.9.0",
  "psutil>=7.2.2",
  "pyhamcrest>=2.1.0",
  "pytest>=9.2.0",
  "pytest-bug>=1.7.0",
  "pytest-pretty>=1.2.0",
  "pytest-reportlog>=0.4.0",
  "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives at ./flaui, not ./src/flaui. Everything under flaui/ is packaged,
# including py.typed and the bundled C# DLLs in flaui/bin/ (uv_build does not read .gitignore).
module-name = "flaui"
module-root = ""

[tool.black]
# https://github.com/psf/black
line-length = 120
exclude = '''
(
  /(
    \.git
    | \.mypy_cache
    | \.pytest_cache
    | htmlcov
    | venv
    | .venv
  )/
)
'''

[tool.coverage.run]
disable_warnings = ["no-data-collected"]
branch = true
source = ["flaui"]
command_line = "-m pytest"
relative_files = true

[tool.coverage.html]
directory = "htmlcov"
skip_empty = true
title = "FlaUI Python Wrapper Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.lcov]
output = "coverage.lcov"

[tool.coverage.report]
# NOTE: deliberately no global `fail_under` here — it would make every `coverage report/xml/html`
# fail on partial runs (the unit-only subsets in Azure smoke and AppVeyor feature branches only
# reach ~83%). The pragmatic gate (initial floor 85, ratcheting toward 90-95) is applied explicitly
# via `coverage report --fail-under=85` on the AppVeyor full-suite path only (see .appveyor.yml).
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
]
# Thin enum / pure-interop modules that carry no testable Python logic in isolation.
omit = [
  "flaui/core/definitions.py",
  "flaui/core/framework_types.py",
  "flaui/core/automation_type.py",
]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203"]
max-complexity = 10

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = true
ignore-setters = false
fail-under = 95
exclude = ["docs", "build"]
ignore-regex = ["^get$", "^mock_.*", ".*BaseClass.*"]
verbose = 2
quiet = false
whitelist-regex = []
color = true
omit-covered-files = false

[tool.isort]
profile = "black"
known_third_party = ["pydantic"]
skip = [".gitignore", ".dockerignore"]
extend_skip = [".md", ".json"]
line_length = 120
skip_gitignore = true
length_sort_straight = true
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
ensure_newline_before_comments = true
use_parentheses = true
py_version = 310

[tool.pytest.ini_options]
addopts = "-ra -q -p no:warnings --report-log=test-report.jsonl"
markers = [
  "wpf_only: Tests that only run on WPF applications",
  "winforms_only: Tests that only run on WinForms applications",
  "uia3_only: Tests that require UIA3 automation type",
  "platform_limitation: Known C# FlaUI platform limitation",
  "windows11: Tests affected by Windows 11 specific behavior",
  "bug: Known bug tracked in GitHub issues (use id and url parameters)",
]
minversion = "8.0"
testpaths = ["tests/"]
# Timeout settings - prevent hanging tests in UI automation
timeout = 30  # Default 30s per test (UI tests can be slow)
timeout_method = "thread"  # Use thread method on Windows for reliability
session_timeout = 1800  # 30 minutes max for full suite

[tool.ruff]
# Group violations by containing file.
respect-gitignore = true
src = ["flaui"]

# Same as Black.
line-length = 120

# Assume Python 3.11.
target-version = "py311"
fix = true

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
ignore = [
  "E501",  # line too long, handled by black
  "B904",  # Within an except clause, raise exceptions with raise ... from err or raise ... from None to distinguish them from errors in exception handling
  "B008",  # Do not perform function call {name} in argument defaults
  "B006",  # Do not use mutable data structures for argument defaults
  "C901",  # too complex
  "E402",  # Module level import not at top of file
]

select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  # "I",  # isort
  "B",  # flake8-bugbear
]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.isort]
order-by-type = true
combine-as-imports = true
force-sort-within-sections = true
lines-after-imports = 1
force-single-line = false
split-on-trailing-comma = false
known-third-party = ["pydantic"]

# Type checking is handled by `ty` (Astral's Rust type checker). Run locally with
# `uv run ty check flaui`; CI enforces it in the Azure linting job.
[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["flaui"]

[tool.ty.rules]
# PythonNet loads C# namespaces (FlaUI.*, System.*) dynamically at runtime and exposes their
# members reflectively, so these are invisible to a static checker. Relax the rules that would
# otherwise flag every C# import and attribute access until typed interop stubs exist.
import-not-found = "ignore"
missing-attribute = "ignore"
# The codebase carries `# pyright: ignore` / `# type: ignore` markers for the C# interop boundary;
# don't fail the build on ones ty considers redundant.
unused-type-ignore-comment = "ignore"

[tool.uv.sources]
flaui = { path = "./flaui" }

# ---------------------------------------------------------------------------------------------
# Static analysis: pylint, bandit, vulture (GH-85). Run with `uv run --group dev <tool> ...`.
# ---------------------------------------------------------------------------------------------
[tool.pylint.main]
py-version = "3.11"
jobs = 0
# PythonNet exposes the C# namespaces (FlaUI.*, System.*) and the `clr` module only at runtime,
# after `setup_pythonnet_bridge()` has loaded the DLLs. Static inference cannot see them, so every
# import from them is an import-error / no-name-in-module and every member access a no-member. Mark
# them as ignored modules (the pylint counterpart of `[tool.ty.rules]` import-not-found /
# missing-attribute) instead of sprinkling per-line disables over the interop code.
ignored-modules = ["FlaUI", "System", "clr", "Interop", "UIAutomationClient"]

[tool.pylint.typecheck]
# `ctypes.windll` only exists on Windows; the Azure lint job runs pylint on Ubuntu.
generated-members = ["ctypes.windll"]

[tool.pylint.refactoring]
# `_raise_translated` always raises, so `handle_csharp_exceptions.wrapper` never falls through.
never-returning-functions = ["sys.exit", "argparse.parse_error", "flaui.lib.exceptions._raise_translated"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.basic]
# C# parity: enum members and C#-facing constants keep FlaUI's PascalCase names
# (`ControlType.Button`, `KnownColor.AliceBlue`, `VirtualKeyShort.KEY_A`).
class-const-naming-style = "any"
# Names kept for 1:1 FlaUI parity where the snake_case form would collide with a Python keyword or
# break the published API (`PropertyCondition.And/Or/Not/Property/Value`, `Retry.While*`), plus the Win32 `hWnd`
# argument and the C#-style `TPattern` type variable. Module-private mutable singletons
# (`_active_sink`, `_executor_singleton`) are not constants.
good-names-rgxs = [
  "^(And|Or|Not|Equals|ToString|Property|PropertyConditionFlags|Value)$",
  "^(While|WhileNot|WhileTrue|WhileFalse|WhileNull|WhileNotNull|WhileEmpty|WhileException|IsTimeOutReached)$",
  "^hWnd$",
  "^TPattern$",
  "^_[a-z][a-z0-9_]*$",
]

[tool.pylint.design]
# Signatures mirror FlaUI's C# overloads (e.g. `Retry.While*`, `Interpolation.execute_rotation`,
# `Color.from_argb`), so allow more parameters than pylint's default of 5.
max-args = 8
max-positional-arguments = 8

[tool.pylint.variables]
# Pydantic validators take a `ValidationInfo` argument they often do not use.
ignored-argument-names = "_.*|^ignored_|^unused_|^info$"

[tool.pylint."messages control"]
disable = [
  # Deliberate architecture, documented in CLAUDE.md ("Late imports for C# types"): C# types are
  # imported inside methods because they only exist once the bridge is set up, and late imports
  # break the automation_elements <-> input / text_range / automation_base import cycles. The
  # cycles pylint reports are exactly those, already resolved at runtime by the late imports.
  "import-outside-toplevel",
  "cyclic-import",
  # 1:1 C# API parity: FlaUI's AutomationElement / Properties / Patterns / Rectangle classes expose
  # dozens of members, and automation_elements.py / windows_api.py / drawing.py mirror whole C#
  # namespaces. Splitting them would break the parity the package exists to provide.
  "too-many-public-methods",
  "too-few-public-methods",
  "too-many-lines",
  # The C# side raises arbitrary .NET exception types across the PythonNet boundary. Broad catches
  # are used only for best-effort cleanup (dispose / detach / close) and for `__repr__` / predicate
  # helpers that must never raise; each logs or re-raises where it matters.
  "broad-exception-caught",
  # Owned by other tools: line length by the formatter (Ruff already ignores E501, see
  # [tool.ruff.lint]) and import order by isort. On case-insensitive Windows file systems pylint
  # also classifies the PythonNet `FlaUI` namespace as the first-party `flaui` package, so its
  # import-order checks misfire on every C# import.
  "line-too-long",
  "wrong-import-order",
  "ungrouped-imports",
]

[tool.vulture]
# `flaui` is a library, so its public API is "unused" from inside the package. Decorated C#-parity
# members are skipped below; the remaining public names live in vulture_whitelist.py.
paths = ["flaui", "vulture_whitelist.py"]
min_confidence = 60
ignore_decorators = [
  "@property",
  "@*.setter",
  "@handle_csharp_exceptions",
  "@staticmethod",
  "@classmethod",
  "@abc.abstractmethod",
  "@field_validator",
  "@model_validator",
]
# Pydantic reads `model_config` reflectively.
ignore_names = ["model_config"]
sort_by_size = true

[tool.bandit]
# Bandit reads this table when run with `-c pyproject.toml`. Tests are not scanned (asserts and
# subprocess launches of the bundled test apps are expected there).
exclude_dirs = ["tests", ".venv", "build", "dist"]
